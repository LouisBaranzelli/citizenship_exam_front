<div class="container">
  <div *ngFor="let row of rows()" class="row">
    <div *ngFor="let answer of row">
      <answer [label]="answer.answer" [showResults]="showResults" [isCorrect]="answer.correct" [isSelected]="answer.isSelected" (answerSelected)="selelectionQuestion(answer, $event)"></answer>
    </div>
  </div>
</div>
